<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Демонстрация экрана</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Segoe UI, sans-serif;
      background: #1e1f22;
      color: #dbdee1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid #2b2d31;
      font-weight: 600;
      font-size: 15px;
    }
    .toolbar {
      padding: 10px 16px;
      border-bottom: 1px solid #2b2d31;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px 20px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: #2b2d31;
      padding: 4px;
      border-radius: 8px;
    }
    .tabs button.tab {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: transparent;
      color: #949ba4;
    }
    .tabs button.tab:hover {
      color: #dbdee1;
    }
    .tabs button.tab.active {
      background: #313338;
      color: #f2f3f5;
    }
    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
    }
    .opts label {
      font-size: 13px;
      color: #b5bac1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .opts select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #2b2d31;
      background: #313338;
      color: #dbdee1;
      font-size: 13px;
      min-width: 120px;
    }
    .hint {
      padding: 8px 16px 0;
      font-size: 13px;
      color: #949ba4;
    }
    #grid {
      flex: 1;
      overflow: auto;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      align-content: start;
    }
    .card {
      border: 2px solid #2b2d31;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      background: #2b2d31;
      transition: border-color 0.12s;
    }
    .card:hover { border-color: #5865f2; }
    .card.selected { border-color: #5865f2; background: #313338; }
    .card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 4px;
      background: #111;
    }
    .card .name {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.3;
      word-break: break-word;
      max-height: 3.9em;
      overflow: hidden;
    }
    footer {
      padding: 12px 16px;
      border-top: 1px solid #2b2d31;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
    }
    label.audio {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: auto;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    button {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button.primary {
      background: #5865f2;
      color: #fff;
    }
    button.primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.ghost {
      background: transparent;
      color: #dbdee1;
    }
    .err {
      padding: 10px 16px;
      color: #ed4245;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>Выбор источника для демонстрации</header>
  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tabScreen" data-tab="screen" role="tab">Экран</button>
      <button type="button" class="tab" id="tabWindow" data-tab="window" role="tab">Окно</button>
    </div>
    <div class="opts">
      <label>
        Качество
        <select id="selQuality" aria-label="Качество потока">
          <option value="480">480p</option>
          <option value="720" selected>720p</option>
          <option value="1080">1080p</option>
          <option value="1440">1440p</option>
        </select>
      </label>
      <label>
        Частота кадров
        <select id="selFps" aria-label="Частота кадров">
          <option value="15">15 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select>
      </label>
    </div>
  </div>
  <p class="hint" id="hint">
    Для игр обычно лучше 720p/30fps — так меньше проседает FPS и стабильнее работает демонстрация.
  </p>
  <div id="err" class="err" style="display:none;"></div>
  <div id="grid"></div>
  <footer>
    <label class="audio" id="audioWrap" style="display:none;">
      <input type="checkbox" id="audioCb" />
      <span>Захватить звук системы</span>
    </label>
    <button type="button" class="ghost" id="btnCancel">Отмена</button>
    <button type="button" class="primary" id="btnOk" disabled>Поделиться</button>
  </footer>
  <script>
    const grid = document.getElementById("grid");
    const btnOk = document.getElementById("btnOk");
    const btnCancel = document.getElementById("btnCancel");
    const audioWrap = document.getElementById("audioWrap");
    const audioCb = document.getElementById("audioCb");
    const hintEl = document.getElementById("hint");
    const errEl = document.getElementById("err");
    const selQuality = document.getElementById("selQuality");
    const selFps = document.getElementById("selFps");
    const tabScreen = document.getElementById("tabScreen");
    const tabWindow = document.getElementById("tabWindow");

    let selectedId = null;
    let currentTab = "screen";

    function showErr(msg) {
      errEl.textContent = msg;
      errEl.style.display = msg ? "block" : "none";
    }

    function setTabUi(tab) {
      currentTab = tab;
      tabScreen.classList.toggle("active", tab === "screen");
      tabWindow.classList.toggle("active", tab === "window");
      try {
        if (hintEl) {
          hintEl.textContent =
            tab === "window"
              ? "Для окон/приложений «только звук окна» зависит от возможностей Windows/Chromium. В Sloncord при включении аудио будет захвачен звук системы. Чтобы не было сюрпризов, по умолчанию звук выключен."
              : "Для игр обычно лучше 720p/30fps — так меньше проседает FPS и стабильнее работает демонстрация.";
        }
      } catch (_) {}
    }

    async function reloadGrid() {
      const api = window.sloncordPicker;
      if (!api) {
        showErr("Ошибка: preload не загружен.");
        return;
      }
      selectedId = null;
      btnOk.disabled = true;
      grid.innerHTML = "";
      showErr("");
      try {
        const items = await api.list(currentTab);
        if (!items.length) {
          showErr(
            currentTab === "screen"
              ? "Нет доступных экранов."
              : "Нет доступных окон."
          );
          return;
        }
        items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.id = item.id;
          card.innerHTML =
            '<img alt="" src="' +
            item.thumbnail.replace(/"/g, "&quot;") +
            '" /><div class="name"></div>';
          card.querySelector(".name").textContent = item.name || item.id;
          card.addEventListener("click", () => {
            selectedId = item.id;
            grid.querySelectorAll(".card").forEach((c) => c.classList.remove("selected"));
            card.classList.add("selected");
            btnOk.disabled = false;
          });
          grid.appendChild(card);
        });
      } catch (e) {
        showErr(String(e && e.message ? e.message : e));
      }
    }

    async function init() {
      const api = window.sloncordPicker;
      if (!api) {
        showErr("Ошибка: preload не загружен.");
        return;
      }
      try {
        const opts = await api.getOptions();
        audioWrap.style.display = "flex";
        try { audioCb.checked = true; } catch (_) {}
        void opts;
        setTabUi("screen");
        await reloadGrid();
      } catch (e) {
        showErr(String(e && e.message ? e.message : e));
      }
    }

    tabScreen.addEventListener("click", async () => {
      setTabUi("screen");
      await reloadGrid();
    });
    tabWindow.addEventListener("click", async () => {
      setTabUi("window");
      // Games/3D apps: prefer conservative defaults to reduce capture overhead.
      try { selQuality.value = "720"; } catch (_) {}
      try { selFps.value = "30"; } catch (_) {}
      await reloadGrid();
    });

    btnOk.addEventListener("click", async () => {
      if (!selectedId || !window.sloncordPicker) return;
      btnOk.disabled = true;
      try {
        const maxHeight = Number(selQuality.value) || 1080;
        const frameRate = Number(selFps.value) || 30;
        await window.sloncordPicker.confirm(
          selectedId,
          !!audioCb.checked,
          maxHeight,
          frameRate
        );
      } catch (e) {
        showErr(String(e && e.message ? e.message : e));
        btnOk.disabled = false;
      }
    });

    btnCancel.addEventListener("click", async () => {
      try {
        await window.sloncordPicker.cancel();
      } catch (_) {}
    });

    init();
  </script>
</body>
</html>
